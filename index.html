<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0d1117" />
  <title>SWGoH Master Farming Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&family=Inter:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var target = sessionStorage.getItem('spaRedirect');
      if (!target) return;
      sessionStorage.removeItem('spaRedirect');
      history.replaceState(null, '', target);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
